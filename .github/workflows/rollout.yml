name: rollout

# Rollout der Tier-Overrides auf alle OpenCode-Coder-Workspaces:
# Push auf .opencode/opencode-model-router.overrides.jsonc → validieren →
# Coder-Container (infrastructure, general, muellerconnect) neu starten.
# Die Entrypoints ziehen beim Start frisches Repo = Overrides aktiv.
# Kein Coder-API-Token nötig: läuft per SSH-Deploy-Key vom Self-hosted Runner
# auf den Coder-Host (Setup: hestia/ci/setup/README.md).
on:
  push:
    branches: [master]
    paths:
      - ".opencode/opencode-model-router.overrides.jsonc"
  workflow_dispatch:

# Doppelter Trigger (Push UND Dispatch) würde zwei parallele Rollouts starten und
# die Workspaces zweimal neu starten. Läuft schon einer, ersetzt ihn der neue.
concurrency:
  group: rollout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollout:
    runs-on: [self-hosted, docker-host]
    env:
      CODER_DEPLOY_KEY: ${{ secrets.CODER_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Tier-Konfiguration validieren
        run: python3 hestia/ci/validate.py
      - name: Deploy-Key hinterlegen
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CODER_DEPLOY_KEY }}" > ~/.ssh/id_ed25519_coderdeploy
          sed -i 's/\r$//' ~/.ssh/id_ed25519_coderdeploy
          chmod 600 ~/.ssh/id_ed25519_coderdeploy
          ssh-keyscan -H 10.0.10.17 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Coder-Container neu starten (Repo-Pull beim Entrypoint)
        run: bash hestia/ci/rollout.sh
