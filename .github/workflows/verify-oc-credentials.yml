name: verify-oc-credentials

# Regressionstest + Selbstheilung der OpenCode-Credential-Kette
# (hestia/ci/check-oc-credentials.sh --fix). Der Cron ist auf */30 gesetzt, GitHub
# führt geplante Workflows aber nur "best effort" aus — real oft nur stündlich bis
# mehrstündig (gemessen 2026-10-14: 6 Läufe/24 h). Der Workflow ist deshalb ein
# SICHERHEITSNETZ, keine Garantie: den Hauptfall (Service.json ist ephemer, der Key
# fehlt nach jedem Container-Neustart) deckt bereits startup.sh bei jedem Start ab.
# Schlägt fehl, wenn
#  - ein gespeicherter 'OpenCode Go'-Account die OPENCODE_API_KEY überstimmt
#    (genau das ließ den Hestia-Kontowechsel wirkungslos werden), oder
#  - der Key des SOT-aktiven Kontos (.opencode/hestia-accounts.jsonc) nicht in
#    den Containern ankommt, oder
#  - das aktive Abo nicht antwortet (Guthaben/Limit).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, docker-host]
    env:
      CODER_DEPLOY_KEY: ${{ secrets.CODER_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy-Key hinterlegen
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CODER_DEPLOY_KEY }}" > ~/.ssh/id_ed25519_coderdeploy
          sed -i 's/\r$//' ~/.ssh/id_ed25519_coderdeploy
          chmod 600 ~/.ssh/id_ed25519_coderdeploy
          ssh-keyscan -H 10.0.10.17 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Credential-Kette prüfen und ggf. heilen
        run: bash hestia/ci/check-oc-credentials.sh --fix
