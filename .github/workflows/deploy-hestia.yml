name: deploy-hestia

# Deploys das Hestia-Panel auf den Coder-Host (10.0.0.10.17):
# hestia/ synchronisieren → docker compose build + up -d.
#
# Voraussetzungen (einmalig, siehe hestia/ci/setup/README.md):
#   1. Self-hosted GitHub-Runner mit Label `docker-host` auf dem Docker-Host (CT 100)
#   2. SSH-Deploy-Key (GitHub-Secret CODER_DEPLOY_KEY) erlaubt root-Zugang zum Coder-Host
on:
  push:
    branches: [master]
    paths:
      - "hestia/**"
      - ".github/workflows/deploy-hestia.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, docker-host]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy-Key hinterlegen
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CODER_DEPLOY_KEY }}" > ~/.ssh/id_ed25519_coderdeploy
          chmod 600 ~/.ssh/id_ed25519_coderdeploy
          ssh-keyscan -H 10.0.10.17 >> ~/.ssh/known_hosts 2>/dev/null

      - name: hestia/ synchronisieren
        run: |
          rsync -a --delete --exclude 'frontend/node_modules' \
            "$(pwd)/hestia/" root@10.0.10.17:/opt/docker-compose/hestia/

      - name: docker compose build + up -d (auf Coder-Host)
        run: |
          ssh -i ~/.ssh/id_ed25519_coderdeploy root@10.0.10.17 \
            "cd /opt/docker-compose/hestia && docker compose build --pull && docker compose up -d && docker image prune -f"

      - name: Healthcheck
        run: |
          sleep 5
          curl -fsS -u "hestia:${{ secrets.HESTIA_PASSWORD }}" http://10.0.10.17:49400/api/health | tee /dev/stderr | grep -q '"ok"' \
            || curl -fsS http://10.0.10.17:49400/api/health
