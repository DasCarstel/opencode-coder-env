name: deploy-coder

# Deployt den Coder-SERVER auf dem Coder-Host (10.0.10.17):
# coder/ synchronisieren → docker compose config -q (validieren) → up -d coder.
#
# ⚠️ BEWUSST MANUELL — dieser Stack ist die STEUERZENTRALE.
# Der Coder-Server provisioniert alle Workspace-Container der Fleet; ein
# fehlerhafter Compose-Stand, ein überschriebener `.env` oder ein
# `docker compose up -d` ohne Service-Angabe legt die komplette Instanz samt
# Datenbank lahm. Deshalb gibt es hier KEINEN `push`-Trigger: der Rollout wird
# von Hand angestoßen, nachdem die Änderung in Ruhe geprüft wurde.
#
# Voraussetzungen (identisch zu deploy-hestia):
#   1. Self-hosted GitHub-Runner mit Label `docker-host` auf dem Docker-Host (CT 100)
#   2. GitHub-Secret CODER_DEPLOY_KEY (privater Deploy-Key, pubkey liegt im
#      authorized_keys des Coder-Hosts)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, docker-host]
    env:
      CODER_DEPLOY_KEY: ${{ secrets.CODER_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Deploy-Key hinterlegen
        run: |
          mkdir -p ~/.ssh
          echo "$CODER_DEPLOY_KEY" > ~/.ssh/id_ed25519_coderdeploy
          sed -i 's/\r$//' ~/.ssh/id_ed25519_coderdeploy
          chmod 600 ~/.ssh/id_ed25519_coderdeploy
          ssh-keyscan -H 10.0.10.17 >> ~/.ssh/known_hosts 2>/dev/null

      - name: coder/ synchronisieren
        # `.env` MUSS ausgeschlossen sein: sie enthält Postgres-Passwort,
        # OIDC-Client-Secret und Token-Encryption-Keys und existiert nur auf dem
        # Host. `*.bak*` ausschließen, weil --delete sonst alte Backups mitnimmt.
        run: |
          rsync -a --delete -e "ssh -i ~/.ssh/id_ed25519_coderdeploy -o IdentitiesOnly=yes" \
            --exclude '.env' \
            --exclude '.env.bak*' \
            "$(pwd)/coder/" root@10.0.10.17:/opt/docker-compose/coder/

      - name: docker compose config -q validieren (auf Coder-Host)
        # `-q` (quiet) prüft nur die Korrektheit und gibt nichts aus; bei einem
        # Fehler bricht der Schritt mit Exit != 0 ab und die laufende Instanz
        # bleibt unangetastet. Erst danach wird überhaupt gestartet.
        run: |
          ssh -i ~/.ssh/id_ed25519_coderdeploy -o IdentitiesOnly=yes root@10.0.10.17 \
            "cd /opt/docker-compose/coder && docker compose config -q"

      - name: docker compose up -d coder (auf Coder-Host)
        # NUR der `coder`-Service. Die Datenbank (`database` / coder-postgres)
        # wird bewusst NICHT angefasst — sie enthält den Produktiv-Datenbestand
        # im Bind-Mount /etc/docker/coder/postgres. Ein `up -d` ohne
        # Service-Angabe würde auch die Datenbank neu erstellen und ist hier
        # deshalb verboten.
        #
        # Bewusst OHNE --pull: das Image `ghcr.io/coder/coder:latest` ist ein
        # floating Tag. Ein --pull würde bei jedem Deploy unangekündigt eine
        # neue Coder-Version einspielen — bei der Steuerzentrale ein
        # unkontrollierbarer Versionssprung inkl. möglicher Migrationsfehler.
        # Bewusste Updates: `docker compose pull coder` von Hand, dann neu deployen.
        run: |
          ssh -i ~/.ssh/id_ed25519_coderdeploy -o IdentitiesOnly=yes root@10.0.10.17 \
            "cd /opt/docker-compose/coder && docker compose up -d coder"

      - name: Healthcheck
        # Kurz-Retry: `up -d` kehrt zurück, bevor der Container voll hoch ist.
        run: |
          ssh -i ~/.ssh/id_ed25519_coderdeploy -o IdentitiesOnly=yes root@10.0.10.17 \
            'for i in $(seq 1 12); do
               if [ "$(docker inspect -f "{{.State.Running}}" coder 2>/dev/null)" = "true" ]; then
                 echo "coder läuft"; exit 0
               fi
               sleep 5
             done
             echo "coder läuft nach 60s nicht" >&2; docker ps -a --filter name=coder >&2; exit 1'

      - name: Coder-UI erreichbar? (nur informativ)
        # Port 7080 ist der Server. Kein harter Fail: der Container kann noch
        # migrieren/starten, während der Job schon weiterläuft.
        run: |
          curl -fsS -m 5 -o /dev/null -w 'HTTP %{http_code}\n' http://10.0.10.17:7080/ \
            || echo "Coder-UI (7080) nicht erreichbar (informativ, kein Fehler)"