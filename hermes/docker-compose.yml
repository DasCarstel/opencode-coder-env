services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-custom:latest
    container_name: hermes
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - coder-infra
    ports:
      - "9119:9119"
      # OpenAI-kompatibler API-Server (Open WebUI). Lauscht NUR auf dem privaten
      # Segment zu CT 100 (vmbr10) - nicht im LAN, nicht ueber Tailscale und
      # nicht vom Proxmox-Host aus erreichbar. Regel hermes-api.yml zeigt
      # dorthin. Ohne Adresse (also "8642:8642") waere der Port wieder im
      # ganzen LAN offen.
      - "10.99.0.2:8642:8642"
    volumes:
      # Laufzeit-Zustand (config.yaml) und die von Hestia gepflegte .env liegen
      # AUSSERHALB des Repos und bleiben beim Deploy erhalten.
      - /etc/docker/hermes/data:/opt/data
      - /opt/docker-compose/hermes/.env:/opt/data/.env
      # Persona aus dem Repo (hermes/SOUL.md). Der Deploy-rsync legt sie ins
      # Deploy-Verzeichnis; der Datei-Mount legt sie ueber den Ordner-Mount,
      # damit /etc/docker/hermes/data unangetastet bleibt. Muster wie .env.
      - /opt/docker-compose/hermes/SOUL.md:/opt/data/SOUL.md
      # Persona des Kleve-Profils, ebenfalls aus dem Repo. Liegt der Ordner-
      # Mount /etc/docker/hermes/data im Weg, legt dieser Datei-Mount die
      # versionierte Fassung darueber (Muster wie die Root-SOUL oben).
      - /opt/docker-compose/hermes/profiles/kleve/SOUL.md:/opt/data/profiles/kleve/SOUL.md
    environment:
      HERMES_DASHBOARD: "1"
    command: ["hermes"]

networks:
  coder-infra:
    external: true